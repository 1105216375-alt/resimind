name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q -o pythonpath=.
      - run: python -m examples.mathematics_agent
      - run: python -m examples.engineering_agent
      - run: python -m examples.agent_demo
      - run: python -m examples.inventory
      - run: python -m examples.document_review
      - run: python -m examples.route_memory
