name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q -o pythonpath=.
      - run: python -m resimind demo
      - run: python -m resimind demo --domain bridge
      - run: python -m resimind demo --domain customer-support
      - run: python -m examples.customer_support --scenario expired
      - run: python -m examples.constrained_optimization
      - run: python -m examples.continuous_bridge
      - run: python -m examples.mathematics_agent
      - run: python -m examples.engineering_agent
      - run: python -m examples.agent_demo
      - run: python -m examples.inventory
      - run: python -m examples.document_review
      - run: python -m examples.route_memory
  optional-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,deepseek,langgraph]'
      - run: python -m pytest -q -o pythonpath=. tests/test_openai_integration.py tests/test_deepseek_integration.py tests/test_langgraph_integration.py
      - run: python -m examples.langgraph_optimization
