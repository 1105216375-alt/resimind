[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resimind"
version = "0.14.0"
description = "Neuro-symbolic agents with verified memory, exact math tools and optional MCP integration"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "1105216375-alt"}, {name = "ResiMind contributors"}]
keywords = ["neuro-symbolic", "reasoning", "verification", "residual", "agents", "mathematics", "engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/1105216375-alt/resimind"
Repository = "https://github.com/1105216375-alt/resimind"
Issues = "https://github.com/1105216375-alt/resimind/issues"

[project.scripts]
resimind = "resimind.cli:main"
resimind-mcp = "resimind.integrations.mcp:main"

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]
mcp = ["mcp>=2.3,<3"]
deepseek = ["openai>=2,<3"]
openai = ["openai>=2,<3"]
langgraph = ["langgraph>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
